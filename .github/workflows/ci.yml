name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TOOLSHOP_UI_BASE_URL: http://localhost:4200
  TOOLSHOP_API_BASE_URL: http://localhost:8091
  TOOLSHOP_ADMIN_EMAIL: admin@practicesoftwaretesting.com
  TOOLSHOP_ADMIN_PASSWORD: welcome01
  TOOLSHOP_HEADLESS: "true"

jobs:
  quality:
    name: Static quality and self-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.13.7
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src tests scripts
      - run: uv run pytest -m self --no-header

  tests:
    name: ${{ matrix.suite }} tests
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [api, ui, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.13.7
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked
      - name: Start the pinned local application
        run: uv run python scripts/app.py start
      - if: matrix.suite != 'api'
        name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: Run PR smoke tests with one diagnostic rerun
        if: github.event_name == 'pull_request'
        run: uv run pytest -m "${{ matrix.suite }} and smoke" -n 2 --reruns 1 --reruns-delay 2
      - name: Run the full suite with one diagnostic rerun
        if: github.event_name != 'pull_request'
        run: uv run pytest -m "${{ matrix.suite }}" -n 2 --reruns 1 --reruns-delay 2
      - name: Capture application logs on failure
        if: failure()
        run: uv run python scripts/app.py logs
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.suite }}-${{ github.run_number }}
          path: artifacts/allure-results
          if-no-files-found: warn
          retention-days: 14
      - name: Upload failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.suite }}-${{ github.run_number }}
          path: artifacts/diagnostics
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop the application
        if: always()
        run: uv run python scripts/app.py stop
